<html lang="es">
  <head>
    <meta charset="utf-8">
    <link href="styles.css" rel="stylesheet">
    <title>Quijote 2077</title>
    <script type="text/javascript" src="web-main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  </head>

  <body onload="documentReady()">
    <div class="chatbox">
      <div class="headerContainer">
        <div id="characterMenuIcon" class="characterMenuIcon" onclick="toggleCharacterMenu()">
          <img alt="character icon" src="images/don-quixote.png"/>
        </div>
        <div class="audioControllerButton" id="audioControllerButton">
          <img src="images/mute-icon.png" alt="sound mute icon"/>
          <p>MUSIC OFF</p>
        </div>
      </div>
      <div id="chatContainer">
      </div>
      <div id="footerContainer" class="footerContainer">
        <div id="inputsContainer" class="inputsContainer">
          <div class="mainDifficultSelector displayNONE" id="enterDifficult">
            <div onclick="selecDifficult('facil')">Facil</div>
            <div onclick="selecDifficult('medio')">Medio</div>
            <div onclick="selecDifficult('dificil')">Dificil</div>
          </div>
          <div class="mainTextInput" id="enterText" click="setFocus()">
              <span class="prompt">></span>
              <input id="chatInput" type="text" value="" label=" "/>
              <button class="sendButton" id="sendButton" onclick="handleSend()">&#9658;</button>
          </div>
          <div class="imputLoading" id="inputLoading">
            <span>Pensando ...</span>
          </div>
        </div>
        <div class="statsBox" id="statsBox">
          <div class="statBar">
            <div id="weightStatBar" class="barInfill"></div>
            <div class="infillText" id="weightInfillText">Peso</div>
          </div>
          <div class="statBar">
            <div id="energyStatBar" class="barInfill"></div>
            <div class="infillText" id="energyInfillText">Energia</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel de personaje -->
    <div id="characterMenu" class="characterMenu displayNONE">
      <div class="characterMenu__header">
        <span id="characterMenu__name">HIDALGO</span>
        <span class="characterMenu__close" onclick="toggleCharacterMenu()">[ X ]</span>
      </div>
      <div class="characterMenu__section">
        <div class="characterMenu__sectionTitle">&gt; INVENTARIO</div>
        <ul id="characterMenu__objects" class="characterMenu__list"></ul>
      </div>
      <div class="characterMenu__section">
        <div class="characterMenu__sectionTitle">&gt; LUGARES VISITADOS</div>
        <ul id="characterMenu__places" class="characterMenu__list characterMenu__placesList"></ul>
      </div>
      <div class="characterMenu__section characterMenu__statsSection">
        <div class="characterMenu__sectionTitle">&gt; ESTADO</div>
        <div class="statsBox statsBox--menu">
          <div class="statBar">
            <div id="weightStatBarMenu" class="barInfill"></div>
            <div class="infillText" id="weightInfillTextMenu">Peso</div>
          </div>
          <div class="statBar">
            <div id="energyStatBarMenu" class="barInfill"></div>
            <div class="infillText" id="energyInfillTextMenu">Energia</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Popup de detalle de lugar -->
    <div id="placeDetailPopup" class="placeDetailPopup displayNONE">
      <div class="characterMenu__header">
        <span id="placeDetailPopup__name"></span>
        <span class="characterMenu__close" onclick="closePlaceDetail()">[ X ]</span>
      </div>
      <p id="placeDetailPopup__desc" class="placeDetailPopup__desc"></p>
    </div>

    <div id="splashScreen">
      <img src="images/quijoteSplash.png" class="backgroundSplashScreen" alt="quixote main screen splash image"/>
      <div id="actionsButtons" class="actionButtons">
        <button id="restartButton" onclick="startGame()" class="insideButton">Comenzar</button>
        <button id="continueButton" onclick="continueGame()" class="insideButton">Continuar</button>
      </div>
      <div id="warningMessage" class="fadeOut displayNONE">
        <p>¿Quieres borrar tu partida y comenzar de nuevo?</p>
        <div id="actionsButtons" class="warningButtons">
          <button id="warningRestart" onclick="startFromWarning()" class="insideButton">Si</button>
          <button id="warningCancel" onclick="cancelContinue()" class="insideButton">No</button>
        </div>
      </div>
    </div>
    <audio id="outerAudio" loop src="/sounds/nightShadecut.mp3"></audio>
  </body>
</html>
